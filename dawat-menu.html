<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dawat Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#3b0a10;--bg2:#561019;--card:#4a0e16;--gold:#f2c14e;--cream:#fff3dc;--rose:#ff6b81;--green:#3fbf6b;--red:#e0483c;--line:rgba(242,193,78,.22);
--disp:'Rozha One',Georgia,serif;--body:'Hind',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.45}
button,input{font:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.screen{display:none;max-width:560px;margin:0 auto;padding:20px 16px 110px;min-height:100vh}
.screen.on{display:block}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0}
.btn{background:var(--gold);color:#3b0a10;border:0;border-radius:999px;padding:14px 26px;font-weight:600;font-size:17px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn:disabled{opacity:.5}
/* name screen */
#s-name{text-align:center;padding-top:14vh}
#s-name h1{font-size:54px;color:var(--gold);letter-spacing:1px}
#s-name p{color:#e9cfae;margin:6px 0 34px}
#s-name input{width:100%;max-width:340px;padding:15px 18px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--cream);font-size:18px;text-align:center;margin-bottom:18px}
/* welcome */
#s-welcome{text-align:center;display:none;position:fixed;inset:0;max-width:none;background:var(--bg);overflow:hidden;z-index:5;padding:0}
#s-welcome.on{display:flex;align-items:center;justify-content:center;flex-direction:column}
.bloom{position:absolute;left:50%;top:50%;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,#7a1a26 0,#561019 60%,transparent 72%);transform:translate(-50%,-50%) scale(0);animation:bloom 2.6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes bloom{to{transform:translate(-50%,-50%) scale(120)}}
.hey{position:relative;font-family:var(--disp);font-size:clamp(34px,9vw,56px);color:var(--cream);padding:0 20px;line-height:1.15}
.hey .nm{color:var(--gold);display:inline-block}
.hey span.w{display:inline-block;opacity:0;transform:translateY(24px) scale(.9);filter:blur(6px);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none;filter:blur(0)}}
.steam{position:relative;height:70px;display:flex;gap:12px;justify-content:center;margin-bottom:14px}
.steam i{width:8px;height:60px;border-radius:8px;background:linear-gradient(transparent,rgba(255,243,220,.5));animation:steam 2.4s ease-in-out infinite;opacity:0}
.steam i:nth-child(2){animation-delay:.5s}.steam i:nth-child(3){animation-delay:1s}
@keyframes steam{0%{transform:translateY(20px) scaleY(.4);opacity:0}40%{opacity:.8}100%{transform:translateY(-14px) scaleY(1.1);opacity:0}}
.skip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));background:none;border:0;color:#e9cfae;text-decoration:underline;cursor:pointer}
/* menu */
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.top h2{font-size:30px;color:var(--gold)}
.top small{color:#e9cfae}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:3}
.tab{white-space:nowrap;background:transparent;color:var(--cream);border:1px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer}
.tab[aria-selected=true]{background:var(--gold);color:#3b0a10;border-color:var(--gold);font-weight:600}
.sec{font-size:15px;color:var(--rose);margin:16px 0 4px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.dot{width:16px;height:16px;border:2px solid;display:grid;place-items:center;border-radius:3px}
.dot::after{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.dot.v{color:var(--green)}.dot.n{color:var(--red)}
.nm2{font-weight:500}
.sub{font-size:13px;color:#d9b896}
.price{color:var(--gold);font-weight:600}
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--gold);border-radius:999px;overflow:hidden;min-width:96px;justify-content:space-between}
.qty button{background:none;border:0;color:var(--gold);width:34px;height:34px;font-size:20px;cursor:pointer}
.qty b{min-width:20px;text-align:center}
.add{background:var(--gold);color:#3b0a10;border:0;border-radius:999px;padding:7px 22px;font-weight:600;cursor:pointer;min-width:96px}
.right{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg2);border-top:1px solid var(--line);display:none;z-index:4}
.bar.on{display:block}
.bar .in{max-width:560px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar .tot{font-family:var(--disp);font-size:24px;color:var(--gold)}
/* checkout + receipt */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0}
.row.t{border-top:1px dashed var(--line);margin-top:8px;padding-top:12px;font-family:var(--disp);font-size:24px;color:var(--gold)}
.note{font-size:13px;color:#d9b896}
.tick{width:84px;height:84px;margin:10px auto}
.tick circle{fill:none;stroke:var(--green);stroke-width:5;stroke-dasharray:252;stroke-dashoffset:252;animation:d 1s .1s forwards}
.tick path{fill:none;stroke:var(--green);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:d .6s 1s forwards}
@keyframes d{to{stroke-dashoffset:0}}
#s-receipt{text-align:center}
#s-receipt .panel{text-align:left}
.err{color:#ffb3a8;margin-top:10px}
@media print{body{background:#fff;color:#000}.btn,.noprint{display:none!important}.panel{border-color:#999;background:#fff}.row.t{color:#000}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>

<!-- 1. Name -->
<section id="s-name" class="screen on">
  <h1>Dawat</h1>
  <p>Multicuisine Restaurant · Chase the taste</p>
  <input id="nameIn" type="text" maxlength="30" placeholder="What’s your name?" autocomplete="given-name" aria-label="Your name">
  <br><button class="btn" id="go">Continue</button>
</section>

<!-- 2. Welcome animation -->
<section id="s-welcome" class="screen">
  <div class="bloom"></div>
  <div class="steam"><i></i><i></i><i></i></div>
  <div class="hey" id="hey"></div>
  <button class="skip" id="skip">Skip</button>
</section>

<!-- 3. Menu -->
<section id="s-menu" class="screen">
  <div class="top"><h2>Dawat</h2><small id="hi"></small></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="list"></div>
</section>

<!-- 4. Bill -->
<section id="s-bill" class="screen">
  <div class="top"><h2>Your order</h2><button class="btn ghost" id="back" style="padding:8px 18px">Edit</button></div>
  <div class="panel" id="billBox"></div>
  <p class="note">You’ll pay securely on Cashfree with UPI, card or net banking.</p>
  <button class="btn" id="pay" style="width:100%">Pay now</button>
  <div class="err" id="err" role="alert"></div>
</section>

<!-- 5. Receipt -->
<section id="s-receipt" class="screen">
  <svg class="tick" viewBox="0 0 90 90"><circle cx="45" cy="45" r="40"/><path d="M27 46l12 12 25-27"/></svg>
  <h2 id="thx" style="font-size:30px;color:var(--gold)"></h2>
  <p id="thx2" style="color:#e9cfae;margin:8px 0 0"></p>
  <div class="panel" id="rcpt"></div>
  <button class="btn noprint" onclick="window.print()">Save or print receipt</button>
  <button class="btn ghost noprint" id="again" style="margin-left:6px">New order</button>
</section>

<div class="bar" id="bar"><div class="in"><div><div class="note" id="cnt"></div><div class="tot" id="tot"></div></div><button class="btn" id="view">View bill</button></div></div>

<script>
/* ============ SETTINGS: edit these ============ */
const CONFIG = {
  CAFE_NAME: "Dawat",
  CASHFREE_MODE: "sandbox",          // change to "production" when you go live
  CREATE_ORDER_URL: "",              // your server URL that creates a Cashfree order (see setup steps). Empty = demo mode
  VERIFY_ORDER_URL: ""               // your server URL that checks the order status, e.g. https://yourdomain.com/api/verify-order
};
/* ============ MENU: edit names & prices here ============ */
// [name, price, pieces, veg?]
const MENU = {
  "Mutton": [["Mutton Seekh Kebab",310,"6 pc"],["Mutton Boti Kebab",310,"6 pc"],["Mutton Tikia",340,"6 pc"]],
  "Fish": [["Fish Tikka Kebab",280,"4 pc"],["Fish Ajwani Kebab",280,"4 pc"],["Fish Afgani Kebab",280,"4 pc"],["Fish Mahi Kebab",280,"4 pc"],["Fish Achari Kebab",280,"4 pc"],["Fish Tandoori Kebab",290,"4 pc"]],
  "Veg": [["Kashmiri Aloo Dum",100],["Mushroom Do Pyaza",150],["Mushroom Masala",140],["Sahi Capsi Cheese Paneer",210],["Paneer Butter Masala",190],["Paneer Masala",190],["Paneer Matar Masala",190],["Malai Paneer",190],["Dal Fry",90],["Dal Makhani",110],["Chana Masala",130],["Palak Paneer",190]],
  "Non-Veg": [["Dum Murg",220,"4 pc"],["Masala Murg",220,"4 pc"],["Murg Do Pyaza",220,"4 pc"],["Murg Butter Masala",240,"6 pc"],["Murg Korma",240,"4 pc"],["Sahi Murg",240,"4 pc"],["Kadai Murg",240,"4 pc"],["Murgh Makhani",270,"4 pc"],["Murgh Reshmi Butter Masala",270,"6 pc"],["Murgh Tikka Masala",270,"6 pc"],["Murgh Bharta",240],["Chicken Kasa",260,"4 pc"],["Chicken Chap",220,"2 pc"]],
  "Drinks": [["Sweet Lassi",70],["Masala Chaas",50],["Fresh Lime Soda",60],["Cold Coffee",90],["Mineral Water",20]] // sample drinks: replace with yours
};
const SECTION_TITLE = {"Mutton":"Non veg (mutton)","Fish":"Fish (vetki)","Veg":"Indian ka khusboo (veg)","Non-Veg":"Non veg","Drinks":"Drinks"};
/* ================================================ */

const $ = id => document.getElementById(id);
const rs = n => "₹" + n.toLocaleString("en-IN");
let name = "", tab = "Veg", cart = {};   // cart: "Cat|index" -> qty

const items = [];
Object.entries(MENU).forEach(([c, arr]) => arr.forEach((it, i) => items.push({key: c + "|" + i, cat: c, name: it[0], price: it[1], note: it[2] || "", veg: c === "Veg" || c === "Drinks"})));
const byKey = k => items.find(x => x.key === k);

function show(id){ document.querySelectorAll(".screen").forEach(s => s.classList.remove("on")); $(id).classList.add("on"); window.scrollTo(0,0); $("bar").classList.toggle("on", id === "s-menu" && total().n > 0); }
function total(){ let n = 0, amt = 0; for (const k in cart){ if (cart[k] > 0){ n += cart[k]; amt += cart[k] * byKey(k).price; } } return {n, amt}; }
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* name -> welcome */
function start(){
  const v = $("nameIn").value.trim();
  if (!v){ $("nameIn").focus(); return; }
  name = v; show("s-welcome");
  const h = $("hey");
  const words = [["Heyy "],[esc(name) + ",","nm"],["<br>"],[CONFIG.CAFE_NAME + " welcomes you","" ]];
  let d = 0.5, html = "";
  [["Heyy","" ],[esc(name)+",","nm"],["BR"],[CONFIG.CAFE_NAME,"nm"],["welcomes","" ],["you","" ]].forEach(([t,c]) => {
    if (t === "BR"){ html += "<br>"; return; }
    html += `<span class="w ${c}" style="animation-delay:${d}s">${t}</span> `; d += 0.35;
  });
  h.innerHTML = html;
  clearTimeout(window._w); window._w = setTimeout(openMenu, 4300);
}
function openMenu(){ clearTimeout(window._w); $("hi").textContent = "Welcome, " + name; renderTabs(); renderList(); show("s-menu"); refreshBar(); }

/* menu */
function renderTabs(){
  $("tabs").innerHTML = Object.keys(MENU).map(c => `<button class="tab" role="tab" aria-selected="${c === tab}" data-c="${c}">${c}</button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => { tab = b.dataset.c; renderTabs(); renderList(); });
}
function renderList(){
  const rows = items.filter(i => i.cat === tab).map(i => {
    const q = cart[i.key] || 0;
    const ctl = q > 0
      ? `<div class="qty"><button data-k="${i.key}" data-d="-1" aria-label="Remove one ${esc(i.name)}">−</button><b>${q}</b><button data-k="${i.key}" data-d="1" aria-label="Add one ${esc(i.name)}">+</button></div>`
      : `<button class="add" data-k="${i.key}" data-d="1">Add</button>`;
    return `<div class="item"><span class="dot ${i.veg ? "v" : "n"}" title="${i.veg ? "Veg" : "Non-veg"}"></span><div><div class="nm2">${esc(i.name)}</div>${i.note ? `<div class="sub">${i.note}</div>` : ""}</div><div class="right"><span class="price">${rs(i.price)}</span>${ctl}</div></div>`;
  }).join("");
  $("list").innerHTML = `<h3 class="sec">${SECTION_TITLE[tab]}</h3>` + rows;
  $("list").querySelectorAll("[data-k]").forEach(b => b.onclick = () => change(b.dataset.k, +b.dataset.d));
}
function change(k, d){ cart[k] = Math.max(0, (cart[k] || 0) + d); renderList(); refreshBar(); }
function refreshBar(){ const t = total(); $("bar").classList.toggle("on", t.n > 0 && $("s-menu").classList.contains("on")); $("cnt").textContent = t.n + (t.n === 1 ? " item" : " items"); $("tot").textContent = rs(t.amt); }

/* bill */
function lines(){ return Object.keys(cart).filter(k => cart[k] > 0).map(k => ({...byKey(k), qty: cart[k]})); }
function billHTML(){
  return lines().map(l => `<div class="row"><span>${esc(l.name)} × ${l.qty}</span><span>${rs(l.qty * l.price)}</span></div>`).join("") + `<div class="row t"><span>Total</span><span>${rs(total().amt)}</span></div>`;
}
$("view").onclick = () => { $("billBox").innerHTML = billHTML(); $("err").textContent = ""; show("s-bill"); };
$("back").onclick = () => show("s-menu");

/* payment (Cashfree) */
function loadCashfree(){
  return new Promise((res, rej) => {
    if (window.Cashfree) return res();
    const s = document.createElement("script"); s.src = "https://sdk.cashfree.com/js/v3/cashfree.js";
    s.onload = res; s.onerror = () => rej(new Error("Could not load Cashfree. Check your connection.")); document.head.appendChild(s);
  });
}
async function pay(){
  const btn = $("pay"); btn.disabled = true; btn.textContent = "Opening payment…"; $("err").textContent = "";
  const order = {customer_name: name, amount: total().amt, items: lines().map(l => ({name: l.name, qty: l.qty, price: l.price}))};
  try {
    if (!CONFIG.CREATE_ORDER_URL){            // demo mode: no real money moves
      await new Promise(r => setTimeout(r, 1200));
      return done({order_id: "DEMO" + Date.now().toString().slice(-8), method: "Demo payment"});
    }
    const r = await fetch(CONFIG.CREATE_ORDER_URL, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(order)});
    if (!r.ok) throw new Error("Could not create the order. Please try again.");
    const {payment_session_id, order_id} = await r.json();
    await loadCashfree();
    const cf = Cashfree({mode: CONFIG.CASHFREE_MODE});
    const result = await cf.checkout({paymentSessionId: payment_session_id, redirectTarget: "_modal"});
    if (result.error) throw new Error(result.error.message || "Payment was not completed.");
    let paid = !!result.paymentDetails;
    if (CONFIG.VERIFY_ORDER_URL){
      const v = await (await fetch(CONFIG.VERIFY_ORDER_URL + "?order_id=" + encodeURIComponent(order_id))).json();
      paid = v.order_status === "PAID";
    }
    if (!paid) throw new Error("Payment not confirmed. If money was deducted, show this screen to staff.");
    done({order_id, method: "Cashfree"});
  } catch (e){
    $("err").textContent = e.message || "Payment failed. Please try again.";
  } finally { btn.disabled = false; btn.textContent = "Pay now"; }
}
$("pay").onclick = pay;

/* receipt */
function done(p){
  const now = new Date().toLocaleString("en-IN", {dateStyle: "medium", timeStyle: "short"});
  $("thx").textContent = "Thank you, " + name + "!";
  $("thx2").textContent = "Your payment went through. Your food is being prepared with love. We hope " + CONFIG.CAFE_NAME + " makes your day delicious.";
  $("rcpt").innerHTML = `<div class="row"><b>${CONFIG.CAFE_NAME} · Payment receipt</b></div><div class="row note"><span>Order ${p.order_id}</span><span>${now}</span></div><div class="row note"><span>Customer</span><span>${esc(name)}</span></div><hr style="border:0;border-top:1px dashed var(--line)">` + billHTML() + `<div class="row note"><span>Paid via</span><span>${p.method}</span></div>`;
  show("s-receipt");
}
$("again").onclick = () => { cart = {}; openMenu(); };

$("go").onclick = start;
$("nameIn").addEventListener("keydown", e => { if (e.key === "Enter") start(); });
$("skip").onclick = openMenu;
</script>
</body>
</html>
